name: Release Builds (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tauri-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            os_name: 'macOS'
          - platform: 'ubuntu-22.04'
            target: ''
            os_name: 'Linux'
          - platform: 'windows-latest'
            target: ''
            os_name: 'Windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build & Package Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'needle-ry1 v__VERSION__'
          releaseBody: |
            ### needle-ry1: Zero-Latency Desktop Command Palette
            
            - **Linux**: `.AppImage` (standalone portable) and `.deb`
            - **Windows**: `.msi` installer and standalone `.exe`
            - **macOS**: Universal `.dmg` (Apple Silicon & Intel)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

  python-standalone-build:
    name: Build Standalone Executables (PyInstaller)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: 'ry1-linux-x86_64'
            binary_name: 'ry1'
          - os: windows-latest
            artifact_name: 'ry1-windows-x86_64'
            binary_name: 'ry1.exe'
          - os: macos-latest
            artifact_name: 'ry1-macos'
            binary_name: 'ry1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pywebview yt-dlp

      - name: Package with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --add-data "src:src" \
            --add-data "src-tauri/tools.json:." \
            python/ry1_app.py --name ry1

      - name: Upload Standalone Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
